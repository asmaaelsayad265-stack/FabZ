services:
  mysql:
    image: mysql:8.0
    command: [ "--default-authentication-plugin=mysql_native_password" ]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      PAYMOB_API_KEY: ${PAYMOB_API_KEY}
      PAYMOB_IFRAME_ID: ${PAYMOB_IFRAME_ID}
      PAYMOB_IFRAME_ID_TEST: ${PAYMOB_IFRAME_ID_TEST}
      PAYMOB_IFRAME_ID_PROD: ${PAYMOB_IFRAME_ID_PROD}
      PAYMOB_INTEGRATION_ID: ${PAYMOB_INTEGRATION_ID}

      FawryReady_BASE_URL: ${FAWRYREADY_BASE_URL}

      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}

      GOOGLE_MEET_CLIENT_ID: ${GOOGLE_MEET_CLIENT_ID}
      GOOGLE_MEET_CLIENT_SECRET: ${GOOGLE_MEET_CLIENT_SECRET}
      GOOGLE_MEET_REFRESH_TOKEN: ${GOOGLE_MEET_REFRESH_TOKEN}
      GOOGLE_MEET_REDIRECT_URI: ${GOOGLE_MEET_REDIRECT_URI}

    depends_on:
      - mysql
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/var/www/html
      - api_storage:/var/www/html/storage

  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules

volumes:
  mysql_data:
  api_storage:
  web_node_modules:

